name: ❓ Question / 質問
description: Ask a question about usage / 使い方が分からない時はこちら
title: "[Question] "
labels: ["question"]

body:
  - type: markdown
    attributes:
      value: |
        🇯🇵 日本語でOKです。
        「これ合ってますか？」レベルでも歓迎します。

        🇺🇸 English is also welcome.
        Simple questions like "Is this correct?" are also welcome.

  - type: dropdown
    id: edition
    attributes:
      label: Edition / 版
      options:
        - Rust prototype / Rustプロトタイプ
        - Python v0.9.1 or earlier (archived) / Python旧版（開発終了）
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question / 質問内容
      placeholder: |
        Example:
        - I don't know how to read this measurement result / この測定結果の見方が分かりません
        - Is this setting correct? / この設定で合っていますか？
    validations:
      required: true
