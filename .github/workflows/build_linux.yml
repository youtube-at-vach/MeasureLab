name: Build Linux Packages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-assets:
        description: Include the AppDir archive for the Release workflow
        type: boolean
        default: false
    outputs:
      artifact:
        description: Linux AppImage package artifact
        value: ${{ jobs.build.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    name: linux-package-build
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    outputs:
      artifact: ${{ inputs.release-assets && 'linux-x86_64' || 'MeasureLab-linux-x86_64-appimage' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.99.0'
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: '. -> target/distribution-linux'
          shared-key: linux-distribution-ubuntu22-x86_64
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev desktop-file-utils
      - name: Test archive validation and launcher
        run: python -m unittest discover -s scripts -p 'test_linux_package.py'
      - name: Build normal desktop, AppImage, archive and SHA-256
        id: package
        run: python -u scripts/linux_package.py build
      - name: Verify package identity and contents
        env:
          RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/linux_package.py verify "$RELEASE_DIR" --source-sha "$SOURCE_SHA" --require-clean
      - name: Stage AppImage and verify exact assets, checksums and source identity
        if: ${{ !inputs.release-assets }}
        id: artifact
        env:
          RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
          SOURCE_SHA: ${{ github.sha }}
        run: python scripts/ci_artifacts.py prepare "$RELEASE_DIR" --platform linux-x86_64 --source-sha "$SOURCE_SHA"
      - name: Upload Linux distribution
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.release-assets && 'linux-x86_64' || 'MeasureLab-linux-x86_64-appimage' }}
          path: ${{ inputs.release-assets && steps.package.outputs.release_dir || steps.artifact.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Show test package download and startup instructions
        if: ${{ !inputs.release-assets }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: python scripts/ci_artifacts.py summary --platform linux-x86_64 --url "$ARTIFACT_URL"

  verify:
    name: linux-package-runtime (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: release-assets
      - name: Install runtime libraries and software Vulkan driver
        run: |
          sudo apt-get update
          alsa=libasound2
          if apt-cache show libasound2t64 >/dev/null 2>&1; then alsa=libasound2t64; fi
          sudo apt-get install -y "$alsa" libx11-6 libxrandr2 libxi6 libxcursor1 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-egl1 libegl1 libgl1 libvulkan1 mesa-vulkan-drivers
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${icds[0]}"
          printf 'VK_ICD_FILENAMES=%s\n' "${icds[0]}" >> "$GITHUB_ENV"
        shell: bash
      - name: Verify downloaded package, normal options and GPU readback
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_ASSETS: ${{ inputs.release-assets }}
        run: |
          args=()
          if [[ "$RELEASE_ASSETS" != true ]]; then args+=(--appimage-only); fi
          python -u scripts/linux_package.py verify release-assets --source-sha "$SOURCE_SHA" --require-clean --runtime --gpu "${args[@]}"
        shell: bash
