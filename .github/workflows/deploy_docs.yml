name: Deploy Docs
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: download-site/package-lock.json
      - run: echo "cache_id=$(date --utc '+%V')" >> "$GITHUB_ENV" 
      - uses: actions/cache@v5
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt
      - name: Install download site dependencies
        working-directory: download-site
        run: npm ci
      - name: Build download site
        working-directory: download-site
        run: npm run build
      - name: Build docs
        run: mkdocs build
      - name: Merge download site into Pages output
        run: |
          mkdir -p site/download
          cp -R download-site/dist/. site/download/
          cp version.json site/version.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

