name: Deploy Docs
on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
            download-site/package-lock.json
      - name: Install PDF font and configure sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install documentation dependencies
        working-directory: docs-site
        run: npm ci
      - name: Install download site dependencies
        working-directory: download-site
        run: npm ci
      - name: Build download site
        working-directory: download-site
        run: npm run build
      - name: Build docs
        working-directory: docs-site
        run: npm run build:all
      - name: Merge download site into Pages output
        run: |
          mkdir -p docs-site/dist/download
          cp -R download-site/dist/. docs-site/dist/download/
          cp version.json docs-site/dist/version.json
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './docs-site/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
