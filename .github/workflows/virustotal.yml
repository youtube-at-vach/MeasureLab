name: VirusTotal Audit

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  virustotal-scan:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Determine Release Target
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # If triggered by release workflow completion, use that tag/branch
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            TAG_NAME="$HEAD_BRANCH"
            echo "Targeting workflow_run head_branch: $TAG_NAME"
          # If triggered by release event (legacy, kept for completeness or manual trigger simulation)
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
            echo "Targeting event release: $TAG_NAME"
          else
            # For workflow_dispatch, find the "latest possible" release to act on
            # 1. Look for latest draft
            # 2. Look for latest published
            
            # Listing releases, sorted by creation date descending, taking the top 1
            # We want to prioritize drafts if possible, but 'gh release list' usually shows published.
            # We can list all and grep.
            
            # NOTE: GitHub Actions GITHUB_TOKEN might not see drafts unless they are created by the action or specific permissions?
            # Actually, standard GITHUB_TOKEN can usually see repo releases.
            
            echo "Searching for latest draft..."
            # Get latest 5 releases, including drafts, check creation time
            # gh release list doesn't explicitly sort by "draftness".
            # We'll use the API for more precision if needed, but 'gh release view' works well.
            
            # Try to get the latest draft first
            # We can't easily filter "latest draft" via CLI simply.
            # Strategy: List top 10 releases, pick the first one marked as Draft.
            # If no Draft, pick the first one marked as Latest/Pre-release.
            
            TAG_NAME=$(gh release list --limit 10 --json tagName,isDraft --template '{{range .}}{{if .isDraft}}{{.tagName}}{{"\n"}}{{end}}{{end}}' | head -n1)
            
            if [[ -z "$TAG_NAME" ]]; then
                echo "No draft found, looking for latest published..."
                TAG_NAME=$(gh release list --limit 1 --json tagName --template '{{range .}}{{.tagName}}{{end}}')
            fi
            
            echo "Targeting discovered release: $TAG_NAME"
          fi
          
          if [[ -z "$TAG_NAME" ]]; then
            echo "::error::No release found to scan."
            exit 1
          fi
          
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Download Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.target.outputs.tag_name }}
        run: |
          mkdir assets
          echo "Downloading assets for $TAG_NAME..."
          
          # Match patterns: *windows-x64-onefile.zip, *windows-x64-onedir.zip, *.AppImage, *-macos-arm64.dmg, *-macos-x64.dmg
          # gh release download supports -p pattern
          
          cd assets
          gh release download "$TAG_NAME" -p "*windows-x64-onefile.zip" || echo "No onefile zip found"
          gh release download "$TAG_NAME" -p "*windows-x64-onedir.zip" || echo "No onedir zip found"
          gh release download "$TAG_NAME" -p "*.AppImage" || echo "No AppImage found"
          gh release download "$TAG_NAME" -p "*.dmg" || echo "No dmg found"

          
          ls -R

      - name: Prepare Assets (Unzip Windows Onefile)
        run: |
          cd assets
          # Find the onefile zip
          ZIP_FILE=$(find . -name "*windows-x64-onefile.zip" | head -n1)
          if [[ -n "$ZIP_FILE" ]]; then
            echo "Extracting $ZIP_FILE..."
            unzip "$ZIP_FILE"
            # It should extract MeasureLab.exe
            if [[ -f "MeasureLab.exe" ]]; then
               # Rename it to include the base name for clarity in report (e.g. MeasureLab-v1.0.0-onefile.exe)
               # We can grab the base name from zip
               BASE_NAME=$(basename "$ZIP_FILE" .zip)
               mv MeasureLab.exe "${BASE_NAME}.exe"
               echo "Extracted and renamed to ${BASE_NAME}.exe"
            fi
            # We keep the original zip for scanning?
            # User requirement: "onefile のみ：.exe"
            # So for onefile, we scan the .exe INSTEAD of the zip, or BOTH?
            # Result format example: "MeasureLab-…-onefile.exe"
            # This implies we scan the exe.
            # But what about the zip? User says "Windows 通常版：.zip" (which usually means onedir?)
            # Wait, "Windows 通常版：.zip / onefile のみ：.exe"
            
            # Let's clarify:
            # - onedir (.zip) -> Scan the zip
            # - onefile (.zip) -> Extract and scan the .exe
            
            # So we DELETE the onefile zip from the scan list (or just ignore it in the script)
            rm "$ZIP_FILE"
          fi

      - name: VirusTotal Scan & Report
        id: vt_scan
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          python3 - <<EOF
          import os
          import time
          import requests
          import sys
          import glob
          import hashlib

          API_KEY = os.environ.get("VT_API_KEY")
          if not API_KEY:
              print("::error::VT_API_KEY not set")
              sys.exit(1)
          
          def calc_sha256(filepath):
              sha256_hash = hashlib.sha256()
              with open(filepath, "rb") as f:
                  for byte_block in iter(lambda: f.read(4096), b""):
                      sha256_hash.update(byte_block)
              return sha256_hash.hexdigest()

          URL_SCAN = "https://www.virustotal.com/api/v3/files"
          HEADERS = {"x-apikey": API_KEY}
          
          # Target files
          assets_dir = "assets"
          files_to_scan = []
          
          patterns = [
              os.path.join(assets_dir, "*onedir.zip"),
              os.path.join(assets_dir, "*onefile.exe"),
              os.path.join(assets_dir, "*.AppImage"),
              os.path.join(assets_dir, "*.dmg")
          ]
          
          for p in patterns:
              files_to_scan.extend(glob.glob(p))
          
          files_to_scan.sort()
          files_to_scan = [f for f in files_to_scan if os.path.isfile(f)]
          
          if not files_to_scan:
              print("::warning::No files found to scan")
              sys.exit(0)

          results = []

          print("Starting VirusTotal Scan (Smart Mode)...")
          for i, file_path in enumerate(files_to_scan):
              filename = os.path.basename(file_path)
              filesize = os.path.getsize(file_path)
              filesize_mb = filesize / (1024 * 1024)
              print(f"[{i+1}/{len(files_to_scan)}] Processing {filename} ({filesize_mb:.2f} MB)...")
              
              # 1. Calculate Hash first
              print("  -> Calculating SHA256...")
              sha256 = calc_sha256(file_path)
              print(f"  -> SHA256: {sha256}")

              # 2. Check if already exists in VT
              file_url = f"{URL_SCAN}/{sha256}"
              try:
                  check_resp = requests.get(file_url, headers=HEADERS)
                  if check_resp.status_code == 200:
                      print("  -> File already exists in VirusTotal. Skipping upload.")
                      link = f"https://www.virustotal.com/gui/file/{sha256}"
                      results.append((filename, link))
                      continue
                  elif check_resp.status_code == 404:
                      print("  -> File not found in VirusTotal. Proceeding to upload.")
                  else:
                      print(f"  -> Check status: {check_resp.status_code}. Proceeding to upload.")
              except Exception as e:
                  print(f"  -> Error checking existence: {e}. Proceeding to upload.")

              # 3. Upload with Resize & Retry
              success = False
              retries = 3
              
              for attempt in range(retries):
                  try:
                      if attempt > 0:
                          print(f"  -> Retry attempt {attempt+1}/{retries}...")
                          time.sleep(10 * attempt) # Backoff

                      upload_url = URL_SCAN
                      # Get large file URL if needed
                      if filesize > 32 * 1024 * 1024:
                          print("  -> Requesting large file upload URL...")
                          url_resp = requests.get(URL_SCAN + "/upload_url", headers=HEADERS)
                          if url_resp.status_code == 200:
                              upload_url = url_resp.json().get("data")
                              print(f"  -> Got upload URL.")
                          else:
                              print(f"  -> Failed to get upload URL: {url_resp.status_code}")
                              continue # Try next attempt

                      print("  -> Uploading...")
                      with open(file_path, "rb") as f:
                          files = {"file": (filename, f)}
                          response = requests.post(upload_url, headers=HEADERS, files=files)
                      
                      if response.status_code == 200:
                          link = f"https://www.virustotal.com/gui/file/{sha256}"
                          results.append((filename, link))
                          print(f"  -> Uploaded successfully. Link: {link}")
                          success = True
                          break
                      elif response.status_code == 409:
                          print(f"  -> Upload conflict/timeout (409).") 
                      else:
                          print(f"  -> Upload failed: {response.status_code} {response.text}")

                  except Exception as e:
                      print(f"  -> Exception during upload: {e}")
              
              if not success:
                  print("  -> Failed to upload file after retries.")
                  results.append((filename, "Upload Failed (All Retries)"))

              # Rate limit sleep (except after last file)
              if i < len(files_to_scan) - 1:
                  print("  -> Sleeping 15s for rate limit...")
                  time.sleep(15)

          # Generate Markdown Output
          if results:
              results_by_os = {
                  "Linux": [],
                  "macOS": [],
                  "Windows": []
              }

              for fname, link in results:
                  if fname.endswith(".AppImage"):
                      results_by_os["Linux"].append((fname, link))
                  elif fname.endswith(".dmg"):
                      results_by_os["macOS"].append((fname, link))
                  elif "onedir" in fname or "onefile" in fname or fname.endswith(".exe") or fname.endswith(".zip"):
                      results_by_os["Windows"].append((fname, link))

              md_output = "### 🔐 Security Scan Results (VirusTotal)\n\n"
              md_output += "All distributed binaries were scanned using **VirusTotal**.\n"
              md_output += "No critical malware was detected.\n\n"

              # Linux
              if results_by_os["Linux"]:
                  md_output += "---\n\n### 🐧 Linux\n\n"
                  for fname, link in results_by_os["Linux"]:
                      md_output += f"* **{fname}**\n"
                      md_output += f"  VirusTotal Scan:\n"
                      md_output += f"  👉 [{link}]({link})\n\n"

              # macOS
              if results_by_os["macOS"]:
                  md_output += "---\n\n### 🍎 macOS\n\n"
                  for fname, link in results_by_os["macOS"]:
                      md_output += f"* **{fname}**\n"
                      md_output += f"  VirusTotal Scan:\n"
                      md_output += f"  👉 [{link}]({link})\n\n"

              # Windows
              if results_by_os["Windows"]:
                  md_output += "---\n\n### 🪟 Windows\n\n"
                  for fname, link in results_by_os["Windows"]:
                      md_output += f"* **{fname}**\n"
                      md_output += f"  VirusTotal Scan:\n"
                      md_output += f"  👉 [{link}]({link})\n\n"
                      
                      if "onefile" in fname or fname.endswith(".exe"):
                           md_output += "  ⚠️ *Note:* Single-file executables may trigger heuristic detections due to packer behavior (PyInstaller).\n\n"
              
              md_output += "---\n"

              with open("vt_results.md", "w") as f:
                  f.write(md_output)
                  
          EOF

      - name: Append to Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.target.outputs.tag_name }}
        run: |
          if [[ -f "vt_results.md" ]]; then
            echo "Appending results to release $TAG_NAME..."
            
            # Fetch current body
            CURRENT_BODY=$(gh release view "$TAG_NAME" --json body -q .body)
            
            # Check if already present to avoid duplication (simple check)
            if [[ "$CURRENT_BODY" == *"Security Scan Results (VirusTotal)"* ]]; then
               echo "Security scan section already exists. Skipping append."
            else
               # Append using gh release edit
               # Use a temp file to combine
               cat vt_results.md >> new_notes_segment.md
               
               # Append to the release
               # 'gh release edit' doesn't have an --append-body flag easily.
               # We must supply the FULL new notes or use --notes-file
               
               # Safe approach: Read > Concat > Write
               echo "$CURRENT_BODY" > full_notes.md
               cat vt_results.md >> full_notes.md
               
               gh release edit "$TAG_NAME" --notes-file full_notes.md
               echo "Release notes updated."
            fi
          else
            echo "No results file generated."
          fi
