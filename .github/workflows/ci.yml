name: Rust checks
on:
  push:
    branches: [main, rewrite/rust]
  pull_request:
    branches: [main, rewrite/rust]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test measurement core without desktop features
        run: cargo test --locked --no-default-features
      - name: Test normal desktop configuration
        run: cargo test --locked
      - run: cargo test --locked --all-targets --all-features
      - name: Build normal desktop release without QA features
        run: cargo build --release --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.95.0'
      - name: Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev
      - name: Check declared minimum Rust version including desktop and QA
        run: cargo check --locked --all-targets --all-features

  # Keep the status name required by main's existing branch ruleset.
  lint-and-test:
    needs: [check, msrv]
    # Report failure even when a dependency fails or is skipped.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Rust check to succeed
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        run: |
          if [[ "$CHECK_RESULT" != success || "$MSRV_RESULT" != success ]]; then
            echo "Rust checks did not all succeed: check=$CHECK_RESULT, msrv=$MSRV_RESULT" >&2
            exit 1
          fi
        shell: bash
