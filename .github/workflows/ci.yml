name: CI

on:
  # PRs validate the merge result; only main needs a post-merge push run.
  push:
    branches: [main]
  pull_request:
    # Retargeting a stacked PR to main emits edited, not opened/synchronize.
    types: [opened, synchronize, reopened, edited]
    branches: [main, rewrite/rust]
  workflow_dispatch:
    inputs:
      benchmarks:
        description: Run full performance benchmarks on Linux
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt an active Pages deployment on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.changes.outputs.rust }}
      msrv: ${{ steps.changes.outputs.msrv }}
      web: ${{ steps.changes.outputs.web }}
      i18n: ${{ steps.changes.outputs.i18n }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Test change classification
        run: python3 -m unittest discover -s scripts -p 'test_ci_changes.py'
      - name: Select expensive checks without skipping required statuses
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [[ "$EVENT_NAME" == push ]]; then
            args+=(--web)
          fi
          if [[ "$EVENT_NAME" == workflow_dispatch || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            python3 scripts/ci_changes.py --all >> "$GITHUB_OUTPUT"
          elif git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > changed-paths
            python3 scripts/ci_changes.py "${args[@]}" < changed-paths >> "$GITHUB_OUTPUT"
          else
            # Missing history means full validation, never an assumed no-op.
            python3 scripts/ci_changes.py --all >> "$GITHUB_OUTPUT"
          fi
        shell: bash

  check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test measurement core without desktop features
        run: cargo test --locked --no-default-features
      - name: Test normal desktop configuration
        run: cargo test --locked
      - name: Test every target and QA configuration (bench cases run once)
        run: cargo test --locked --all-targets --all-features
      - name: Test QA documentation
        run: cargo test --locked --doc --all-features

  msrv:
    needs: changes
    if: needs.changes.outputs.msrv == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev
      - name: Check declared minimum Rust version including desktop and QA
        run: cargo check --locked --all-targets --all-features

  # Preserve the existing required status; optional OS/release jobs do not gate it.
  lint-and-test:
    needs: [changes, check, msrv]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected Rust checks to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          MSRV_CHANGED: ${{ needs.changes.outputs.msrv }}
          CHECK_RESULT: ${{ needs.check.result }}
          MSRV_RESULT: ${{ needs.msrv.result }}
        run: |
          if [[ "$CHANGES_RESULT" != success ]]; then
            echo "Change classification failed: $CHANGES_RESULT" >&2
            exit 1
          fi
          case "$RUST_CHANGED:$CHECK_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Required Rust check failed: selected=$RUST_CHANGED result=$CHECK_RESULT" >&2; exit 1 ;;
          esac
          case "$MSRV_CHANGED:$MSRV_RESULT" in
            true:success|false:skipped) ;;
            *) echo "Required MSRV check failed: selected=$MSRV_CHANGED result=$MSRV_RESULT" >&2; exit 1 ;;
          esac
        shell: bash

  # Reuse the package lifecycle checks and collect all four downloads in this run.
  windows-package:
    if: github.event_name != 'push'
    uses: ./.github/workflows/build_windows.yml

  macos-package:
    if: github.event_name != 'push'
    uses: ./.github/workflows/build_macos.yml

  linux-package:
    if: github.event_name != 'push'
    uses: ./.github/workflows/build_linux.yml

  compatibility:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.13'
      - name: Test desktop actions without starting GUI or audio
        run: python -m unittest discover -s scripts -p 'test_dev_actions.py'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev
      - name: Test OS-specific code and QA (Linux is covered by required checks)
        if: runner.os != 'Linux'
        run: cargo test --locked --all-features
      - name: Build normal desktop release without QA features
        # PR/manual runs already build normal releases in the packaging jobs.
        if: github.event_name == 'push'
        run: cargo build --release --locked
      - name: Full performance benchmarks (manual opt-in)
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.benchmarks
        run: cargo bench --locked --no-default-features

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o checksums.txt
          awk -v name="$archive" '$2 == name { print; found = 1 } END { if (!found) exit 1 }' checksums.txt > selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" actionlint
        shell: bash
      - run: ./actionlint -color
      - name: Test native artifact selection and integrity failures
        run: python3 -m unittest discover -s scripts -p 'test_ci_artifacts.py'

  build:
    # Preserve the existing required status and Pages dependency.
    name: docs-lint
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Translation tasks are checked against the exact PR/push base snapshot.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-docs.txt
            requirements-i18n.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: download-site/package-lock.json
      - name: Install static check tools
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install ruff
      - name: Install catalog check tools
        if: needs.changes.outputs.i18n == 'true'
        run: .venv/bin/python -m pip install -r requirements-i18n.txt
      - name: Check Python tools
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Test desktop action commands with fake Cargo
        run: .venv/bin/python -m unittest discover -s scripts -p 'test_dev_actions.py'
      - name: Test catalogs, deferred translation diffs, and scope validation
        if: needs.changes.outputs.i18n == 'true'
        run: .venv/bin/python -m unittest discover -s scripts -p 'test_i18n.py'
      - name: Check catalogs and translation PR scope (read only)
        if: needs.changes.outputs.i18n == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [[ "$EVENT_NAME" != workflow_dispatch && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            args+=(--base "$BASE_SHA")
            if ! git diff --quiet "$BASE_SHA" -- i18n/translation-task.json; then
              args+=(--task i18n/translation-task.json)
            fi
          fi
          .venv/bin/python scripts/i18n.py check "${args[@]}"
        shell: bash
      - name: Check Markdown
        run: npx --yes markdownlint-cli2@0.23.3 '**/*.md' '#node_modules'
      - name: Install documentation and site tools
        if: needs.changes.outputs.web == 'true'
        run: |
          .venv/bin/python -m pip install -r requirements-docs.txt
          npm --prefix download-site ci
      - name: Test download selection
        if: needs.changes.outputs.web == 'true'
        run: npm --prefix download-site test
      - name: Build both manuals and download site; verify preserved routes
        if: needs.changes.outputs.web == 'true'
        run: .venv/bin/python scripts/build_pages.py
      - name: Upload preview for review
        if: needs.changes.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-preview
          path: site/
          retention-days: 7
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [build, lint-and-test, actionlint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated combined site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
