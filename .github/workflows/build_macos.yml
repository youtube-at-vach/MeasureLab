name: Build macOS Packages

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-assets:
        description: Keep the Release workflow asset layout
        type: boolean
        default: false
    outputs:
      intel_artifact:
        description: Verified Intel macOS DMG, build identity and checksums
        value: ${{ inputs.release-assets && 'macos-x86_64' || 'MeasureLab-macos-x86_64-dmg' }}
      arm64_artifact:
        description: Verified Apple Silicon macOS DMG, build identity and checksums
        value: ${{ inputs.release-assets && 'macos-arm64' || 'MeasureLab-macos-arm64-dmg' }}

permissions:
  contents: read

jobs:
  build:
    name: macos-package (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            arch: x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: '. -> target/distribution-macos'
          shared-key: macos-distribution-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test release integrity and macOS permission metadata
        run: python -m unittest discover -s scripts -p 'test_macos_package.py'
      - name: Build normal desktop, sign with audio-input entitlement, create and test DMG
        id: package
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python -u scripts/macos_package.py build --target "$PACKAGE_TARGET"
      - name: Verify clean source identity, mounted app and copied app after eject
        env:
          RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
          SOURCE_SHA: ${{ github.sha }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: python scripts/macos_package.py verify "$RELEASE_DIR" --target "$PACKAGE_TARGET" --source-sha "$SOURCE_SHA" --require-clean --runtime
      - name: Stage DMG and verify exact assets, checksums and source identity
        if: ${{ !inputs.release-assets }}
        id: artifact
        env:
          RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
          SOURCE_SHA: ${{ github.sha }}
          PACKAGE_PLATFORM: macos-${{ matrix.arch }}
        run: python scripts/ci_artifacts.py prepare "$RELEASE_DIR" --platform "$PACKAGE_PLATFORM" --source-sha "$SOURCE_SHA"
      - name: Upload verified macOS distribution
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.release-assets && format('macos-{0}', matrix.arch) || format('MeasureLab-macos-{0}-dmg', matrix.arch) }}
          path: ${{ inputs.release-assets && steps.package.outputs.release_dir || steps.artifact.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Show test package download and startup instructions
        if: ${{ !inputs.release-assets }}
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          PACKAGE_PLATFORM: macos-${{ matrix.arch }}
        run: python scripts/ci_artifacts.py summary --platform "$PACKAGE_PLATFORM" --url "$ARTIFACT_URL"
