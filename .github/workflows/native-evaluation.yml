name: Native evaluation
run-name: Native evaluation (${{ inputs.suite || 'all' }}) on ${{ github.head_ref || github.ref_name }}

on:
  # Explicit label requests work before this workflow reaches the default branch.
  pull_request:
    branches: ["main", "codex/next-core-evaluation", "codex/migration-*"]
    types: [labeled]
  workflow_dispatch:
    inputs:
      suite:
        description: Native checks to run (all excludes the deferred renderer spike)
        type: choice
        required: true
        default: all
        options:
          - all
          - probe-core
          - audio-backend
          - renderer-spike
          - qt-boundary

permissions:
  contents: read

concurrency:
  # Unrelated PR labels must not cancel an explicitly requested run.
  group: native-evaluation-${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-native-evaluation') && (github.head_ref || github.ref_name) || github.run_id }}
  cancel-in-progress: true

jobs:
  probe-core:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'probe-core')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-native-evaluation')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust format, pure worker, DSP, graph and audio boundary tests and Clippy
        working-directory: native
        run: |
          cargo fmt --all --check
          cargo test --locked -p probe-core -p display-core -p dsp-core -p graph-core -p audio-core
          cargo build --locked -p dsp-core --bin fft-candidate
          cargo build --locked -p graph-core --bin graph-core
          cargo build --locked -p graph-core --bin history-candidate
          cargo build --locked -p graph-core --bin filter-candidate
          cargo build --locked -p graph-core --bin result-candidate
          cargo build --locked -p graph-core --bin acquisition-candidate
          cargo build --locked -p graph-core --bin backend-input-candidate
          cargo build --locked -p graph-core --bin trigger-candidate
          cargo build --locked -p audio-core
          cargo build --locked -p audio-core --bin route-candidate
          cargo clippy --locked -p probe-core -p display-core -p dsp-core -p graph-core -p audio-core --all-targets -- -D warnings
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Compare immutable FFT fixtures without Qt or audio dependencies
        run: |
          python -m venv .venv
          ./.venv/bin/python -m pip install numpy==2.2.6 pytest==9.1.1
          ./.venv/bin/python -m pytest -q -m native tests/logic_verification/test_migration_*candidate.py tests/logic_verification/test_migration_audio_graph.py tests/logic_verification/test_migration_audio_route.py
          ./.venv/bin/python -m pytest -q tests/logic_verification/test_migration_backend_input.py

  audio-backend:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'audio-backend')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-native-evaluation')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install ALSA build prerequisites
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Build and lint native input adapters without Qt or hardware
        working-directory: native
        run: |
          cargo build --locked -p audio-probe
          cargo test --locked -p audio-probe -p portaudio-input
          cargo test --locked -p display-core --features live-audio
          cargo clippy --locked -p audio-probe -p portaudio-input -p display-core --features live-audio --all-targets -- -D warnings
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test live evidence rejection without Qt or audio devices
        run: |
          python -m pip install numpy==2.2.6 pytest
          python -m pytest -q tests/logic_verification/test_migration_qt_live.py
          python -m pytest -q tests/logic_verification/test_migration_filter_live.py

  # Deferred work must be requested separately; milestone checks focus on MIG-008.
  renderer-spike:
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'renderer-spike'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check isolated renderer without Qt or GPU execution
        working-directory: native/renderer-spike
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --release --locked
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Test spike evidence rejection without a GUI
        run: |
          python -m pip install numpy==2.2.6 pytest
          python -m pytest -q tests/logic_verification/test_migration_plot_renderer.py

  qt-boundary:
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.suite == 'all' || inputs.suite == 'qt-boundary')) ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-native-evaluation')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libgl1-mesa-dev libgl1 libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 libasound2-dev
      - name: Install isolated development SDK from pinned specification
        run: |
          python -m pip install -r native/build-requirements.txt
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib
          spec = tomllib.loads(pathlib.Path("native/qt-sdk.toml").read_text())
          target = spec["linux"]
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "qt"
          archives = [*spec["archives"], *target.get("extra_archives", [])]
          subprocess.run(["aqt", "install-qt", target["host"], target["target"], spec["version"], target["arch"], "--outputdir", str(destination), "--archives", *archives], check=True)
          prefix = destination / spec["version"] / target["directory"]
          # CXX-Qt queries qmake with env_clear(); SDK dependencies must resolve without LD_LIBRARY_PATH.
          actual = subprocess.check_output([str(prefix / "bin/qmake"), "-query", "QT_VERSION"], env={}, text=True).strip()
          if actual != spec["version"]:
              raise RuntimeError(f"Qt SDK mismatch: {actual} != {spec['version']}")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"QMAKE={prefix}/bin/qmake\nQT_EVALUATION_PREFIX={prefix}\n")
          PY
      - name: Build and lint Rust Qt adapters
        working-directory: native
        run: |
          cargo build --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run shared QML lifecycle checks
        timeout-minutes: 10
        run: |
          python -m pip install numpy==2.2.6 pytest
          python scripts/check_trn_keys.py --strict
          python -m pytest -q tests/logic_verification/test_migration_qt_workspace.py tests/logic_verification/test_migration_qt_display.py tests/logic_verification/test_migration_qt_trigger.py tests/logic_verification/test_migration_qt_calibration.py tests/logic_verification/test_migration_qt_calibration_edit.py tests/logic_verification/test_migration_qt_save.py
          python -m pytest -q tests/logic_verification/test_migration_qt_import.py
          python -m pytest -q tests/logic_verification/test_migration_qt_filter.py
          # One representative saved flow covers shared display, Trigger, calibration and all save formats.
          python scripts/migration_qt_filter.py --qt-prefix "$QT_EVALUATION_PREFIX" --portable --channels 2 --precision F32 --window SymmetricHann --language en --output qt-filter-results
