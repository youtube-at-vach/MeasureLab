name: Native evaluation

on:
  push:
    branches: ["codex/next-core-evaluation", "codex/migration-*"]
    paths: ["native/**", "scripts/migration_qt_probe.py", ".github/workflows/native-evaluation.yml"]
  pull_request:
    branches: ["main", "codex/next-core-evaluation"]
    paths: ["native/**", "scripts/migration_qt_probe.py", ".github/workflows/native-evaluation.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust format, pure worker tests and Clippy
        working-directory: native
        run: |
          cargo fmt --all --check
          cargo test --locked -p probe-core
          cargo clippy --locked -p probe-core --all-targets -- -D warnings

  qt-boundary:
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Qt runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libegl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3
      - name: Install isolated development SDK from pinned specification
        run: |
          python -m pip install -r native/build-requirements.txt
          python - <<'PY'
          import os
          import pathlib
          import subprocess
          import tomllib
          spec = tomllib.loads(pathlib.Path("native/qt-sdk.toml").read_text())
          target = spec["linux"]
          destination = pathlib.Path(os.environ["RUNNER_TEMP"]) / "qt"
          subprocess.run(["aqt", "install-qt", target["host"], target["target"], spec["version"], target["arch"], "--outputdir", str(destination), "--archives", *spec["archives"]], check=True)
          prefix = destination / spec["version"] / target["directory"]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"QMAKE={prefix}/bin/qmake\nQT_EVALUATION_PREFIX={prefix}\n")
          PY
      - name: Build and lint Rust Qt adapters
        working-directory: native
        run: |
          cargo build --locked --workspace
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run shared QML lifecycle checks
        run: python scripts/migration_qt_probe.py --qt-prefix "$QT_EVALUATION_PREFIX" --repeat 3
