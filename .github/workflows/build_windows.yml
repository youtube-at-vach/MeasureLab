name: Build Windows Executable

on:

  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - '*.py'
              - '*.spec'
              - '*.sh'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'constraints.txt'
              - 'app_icon.*'
              - 'entitlements_mac.plist'
              - '.github/workflows/build*.yml'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        # Pin setuptools to avoid distutils issues if necessary, though less common on Win with recent python
        # pip install "setuptools<70.0.0" 

    - name: Convert Icon
      run: |
        # ImageMagick is pre-installed on windows-latest
        magick app_icon.png -define icon:auto-resize=256,128,64,48,32,16 app_icon.ico

    - name: Prepare System ICU DLLs
      id: prepare-icu
      run: |
        mkdir libs
        copy C:\Windows\System32\icu.dll libs\
        copy C:\Windows\System32\icuuc.dll libs\
        copy C:\Windows\System32\icuin.dll libs\
        echo "ICU DLLs copied to libs/"
        ls libs

        # Note: Windows uses ; as separator for add-data
        pyinstaller --onefile --windowed --name MeasureLab --icon=app_icon.ico --add-data "src;src" --add-binary "libs/icu*.dll;." --exclude-module matplotlib --collect-all backports --collect-all soundfile --collect-all pyfftw --hidden-import pyfftw --distpath dist/onefile --workpath build/onefile main_gui.py

    - name: Verify Windows Executable (GUI Self-Test)
      run: |
        echo "Testing dist/onefile/MeasureLab.exe with --self-test..."
        $process = Start-Process -Wait -PassThru -FilePath "dist/onefile/MeasureLab.exe" -ArgumentList "--self-test"
        if ($process.ExitCode -ne 0) {
            Write-Error "Self-test failed with exit code $($process.ExitCode)"
            exit $process.ExitCode
        }

    - name: Build (onedir) with PyInstaller
      run: |
        # Default PyInstaller mode is onedir (folder-based distribution)
        pyinstaller --windowed --name MeasureLab --icon=app_icon.ico --add-data "src;src" --add-binary "libs/icu*.dll;." --exclude-module matplotlib --collect-all backports --collect-all soundfile --collect-all pyfftw --hidden-import pyfftw --distpath dist/onedir --workpath build/onedir main_gui.py
        copy scripts/enable_asio.bat dist/onedir/MeasureLab/
        copy scripts/disable_asio.bat dist/onedir/MeasureLab/
        copy scripts/README_ASIO.txt dist/onedir/MeasureLab/

    - name: Upload Artifact (onefile)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: MeasureLab_Windows_onefile
        path: dist/onefile/MeasureLab.exe

    - name: Upload Artifact (onedir)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: MeasureLab_Windows_onedir
        path: dist/onedir/MeasureLab/
