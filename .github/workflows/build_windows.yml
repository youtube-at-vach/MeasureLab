name: Build Windows Packages

on:

  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'scripts/**'
              - 'packaging/windows/**'
              - '.github/workflows/release.yml'
              - '*.py'
              - '*.spec'
              - '*.sh'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'constraints.txt'
              - 'app_icon.*'
              - 'entitlements_mac.plist'
              - '.github/workflows/build*.yml'

  build:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.code == 'true'
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        # Pin setuptools to avoid distutils issues if necessary, though less common on Win with recent python
        # pip install "setuptools<70.0.0" 

    - name: Convert Icon
      run: |
        # ImageMagick is pre-installed on windows-latest
        magick app_icon.png -define icon:auto-resize=256,128,64,48,32,16 app_icon.ico

    - name: Prepare System ICU DLLs
      run: |
        mkdir libs
        copy C:\Windows\System32\icu.dll libs\
        copy C:\Windows\System32\icuuc.dll libs\
        copy C:\Windows\System32\icuin.dll libs\
        echo "ICU DLLs copied to libs/"
        ls libs

    - name: Build (onedir) with PyInstaller
      run: |
        # Default PyInstaller mode is onedir (folder-based distribution)
        pyinstaller --windowed --name MeasureLab --icon=app_icon.ico --add-data "src;src" --add-binary "libs/icu*.dll;." --exclude-module matplotlib --collect-all backports --collect-all soundfile --collect-all pyfftw --hidden-import pyfftw --distpath dist/onedir --workpath build/onedir main_gui.py
        copy scripts/enable_asio.bat dist/onedir/MeasureLab/
        copy scripts/disable_asio.bat dist/onedir/MeasureLab/
        copy scripts/README_ASIO.txt dist/onedir/MeasureLab/

    - name: Build Windows installer
      id: installer
      shell: pwsh
      run: ./scripts/build_windows_installer.ps1

    - name: Test Windows installer lifecycle
      shell: pwsh
      env:
        INSTALLER_PATH: ${{ steps.installer.outputs.installer }}
      run: ./scripts/test_windows_installer.ps1 -Installer $env:INSTALLER_PATH

    - name: Upload installer test logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: windows-installer-test-logs
        path: dist/installer-test/*.log
        if-no-files-found: ignore

    - name: Upload Artifact (onedir)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: MeasureLab_Windows_onedir
        path: dist/onedir/MeasureLab/

    - name: Upload Artifact (installer)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: MeasureLab_Windows_installer
        path: dist/release/*-windows-x64-setup.exe
        if-no-files-found: error
