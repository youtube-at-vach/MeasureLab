name: PDF Draft

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: 'pip'

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cffi python3-brotli libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-cjk

      - name: Install MkDocs and plugins
        run: |
          pip install mkdocs-material mkdocs-with-pdf mkdocs-static-i18n pyyaml qrcode

      - name: Build Docs
        env:
          ENABLE_PDF_EXPORT: 1
        run: mkdocs build

      - name: Rename Output Files
        run: |
          mv site/pdf/operation_manual.pdf site/pdf/operation_manual_ja.pdf
          mv site/en/pdf/operation_manual.pdf site/en/pdf/operation_manual_en.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          path: |
            site/pdf/operation_manual_ja.pdf
            site/en/pdf/operation_manual_en.pdf
          retention-days: 5
