name: PDF Draft

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
          cache: 'pip'

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cffi python3-brotli libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-cjk

      - name: Install MkDocs and plugins
        run: |
          pip install mkdocs-material mkdocs-with-pdf pyyaml

      - name: Create PDF config
        shell: python
        run: |
          import yaml
          
          with open('mkdocs.yml', 'r', encoding='utf-8') as f:
              config = yaml.safe_load(f)
          
          if 'plugins' not in config:
              config['plugins'] = []
          
          # Add with-pdf plugin
          config['plugins'].append({
              'with-pdf': {
                  'author': '',
                  'copyright': 'Unlicense',
                  'cover_subtitle': '',
                  'output_path': 'pdf/manual.pdf'
              }
          })
          
          with open('mkdocs_pdf.yml', 'w', encoding='utf-8') as f:
              yaml.dump(config, f, allow_unicode=True)

      - name: Build Docs
        run: mkdocs build -f mkdocs_pdf.yml

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-pdf
          path: site/pdf/manual.pdf
          retention-days: 5
