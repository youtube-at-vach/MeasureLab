name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        # Pin setuptools to avoid distutils issues if necessary
        # pip install "setuptools<70.0.0" 

    - name: Convert Icon
      run: |
        magick app_icon.png -define icon:auto-resize=256,128,64,48,32,16 app_icon.ico

    - name: Build (onefile) with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name MeasureLab --icon=app_icon.ico --add-data "src;src" --collect-all backports --collect-all pyfftw --hidden-import pyfftw --distpath dist/onefile --workpath build/onefile main_gui.py

    - name: Build (onedir) with PyInstaller
      run: |
        pyinstaller --windowed --name MeasureLab --icon=app_icon.ico --add-data "src;src" --collect-all backports --collect-all pyfftw --hidden-import pyfftw --distpath dist/onedir --workpath build/onedir main_gui.py

    - name: Package Windows release assets
      shell: pwsh
      run: |
        # タグ名を取得（refs/tags/... から取り除く）
        $tag = $env:GITHUB_REF -replace 'refs/tags/',''
        if (-not $tag) { $tag = 'untagged' }
        # ファイル名に使えない文字を置換
        $tag = $tag -replace '[\\/*?:"<>|]', '-'

        $outDir = "dist/release"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        $base = "MeasureLab-$tag-windows-x64"
        Copy-Item -Path "dist/onefile/MeasureLab.exe" -Destination "$outDir/$base.exe"
        Compress-Archive -Path "dist/onedir/MeasureLab" -DestinationPath "$outDir/$base-onedir.zip" -Force

    - name: VirusTotal Scan
      id: vt
      uses: crazy-max/ghaction-virustotal@v4
      with:
        vt_api_key: ${{ secrets.VT_API_KEY }}
        files: |
          dist/release/*.exe
          dist/release/*.zip

    - name: Generate VT Report Lines
      if: steps.vt.outputs.json != ''
      shell: pwsh
      run: |
        $json = '${{ steps.vt.outputs.json }}' | ConvertFrom-Json
        $content = ""
        foreach ($item in $json) {
            $baseName = Split-Path $item.filename -Leaf
            $content += "- [$baseName]($($item.url))`n"
        }
        + $content | Out-File -FilePath vt_url_windows.txt -Encoding utf8

    - name: Upload VT URL
      uses: actions/upload-artifact@v4
      with:
        name: vt-url-windows
        path: vt_url_windows.txt
        if-no-files-found: ignore

    - name: Upload Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: assets-windows
        path: dist/release/*

  build-linux:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libxcb-cursor0 python3-cffi python3-brotli libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-cjk

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<70.0.0"
        pip install -r requirements.txt
        pip install pyinstaller
        pip install mkdocs-material mkdocs-with-pdf mkdocs-static-i18n pyyaml qrcode mini-racer

    - name: Build standalone binary with PyInstaller
      run: |
        mkdir -p libs
        pyinstaller --onefile --windowed --name MeasureLab --icon=app_icon.png --add-data "src:src" --exclude-module matplotlib --collect-all backports --collect-all pyfftw --hidden-import pyfftw main_gui.py

    - name: Build Documentation
      env:
        ENABLE_PDF_EXPORT: 1
      run: mkdocs build

    - name: Prepare Manuals for release
      run: |
        mkdir -p dist/release
        mv site/pdf/operation_manual.pdf dist/release/operation_manual_ja.pdf
        mv site/en/pdf/operation_manual.pdf dist/release/operation_manual_en.pdf

    - name: Build AppImage
      run: |
        chmod +x build_appimage.sh
        ./build_appimage.sh

    - name: Rename AppImage for release
      shell: bash
      run: |
        set -euo pipefail
        tag="${GITHUB_REF#refs/tags/}"
        tag="${tag//\//-}"
        mkdir -p dist/release
        shopt -s nullglob
        candidates=(MeasureLab*.AppImage)
        if [ ${#candidates[@]} -eq 0 ]; then
          echo "No AppImage found" >&2
          exit 1
        fi
        mv "${candidates[0]}" "dist/release/MeasureLab-${tag}-linux-x86_64.AppImage"

    - name: VirusTotal Scan
      id: vt
      uses: crazy-max/ghaction-virustotal@v4
      with:
        vt_api_key: ${{ secrets.VT_API_KEY }}
        files: dist/release/*.AppImage

    - name: Generate VT Report Lines
      if: steps.vt.outputs.json != ''
      shell: bash
      run: |
        echo '${{ steps.vt.outputs.json }}' | jq -r '.[] | "- [\(.filename | split("/") | last)](\(.url))"' > vt_url_linux.txt

    - name: Upload VT URL
      uses: actions/upload-artifact@v4
      with:
        name: vt-url-linux
        path: vt_url_linux.txt
        if-no-files-found: ignore

    - name: Upload Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: assets-linux
        path: dist/release/*

  build-macos:
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install System Dependencies
      run: |
        brew install create-dmg portaudio fftw libsndfile

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Create App Icon
      run: |
        mkdir MeasureLab.iconset
        sips -z 16 16     app_icon.png --out MeasureLab.iconset/icon_16x16.png
        sips -z 32 32     app_icon.png --out MeasureLab.iconset/icon_16x16@2x.png
        sips -z 32 32     app_icon.png --out MeasureLab.iconset/icon_32x32.png
        sips -z 64 64     app_icon.png --out MeasureLab.iconset/icon_32x32@2x.png
        sips -z 128 128   app_icon.png --out MeasureLab.iconset/icon_128x128.png
        sips -z 256 256   app_icon.png --out MeasureLab.iconset/icon_128x128@2x.png
        sips -z 256 256   app_icon.png --out MeasureLab.iconset/icon_256x256.png
        sips -z 512 512   app_icon.png --out MeasureLab.iconset/icon_256x256@2x.png
        sips -z 512 512   app_icon.png --out MeasureLab.iconset/icon_512x512.png
        sips -z 1024 1024 app_icon.png --out MeasureLab.iconset/icon_512x512@2x.png
        iconutil -c icns MeasureLab.iconset
        rm -rf MeasureLab.iconset

    - name: Build with PyInstaller
      run: |
        pyinstaller --windowed --noconfirm --name MeasureLab --icon=MeasureLab.icns \
          --add-data "src:src" \
          --exclude-module matplotlib \
          --collect-all backports \
          --collect-all soundfile \
          --collect-all pyfftw \
          --hidden-import pyfftw \
          --distpath dist \
          --workpath build \
          --target-architecture arm64 \
          main_gui.py

    - name: Verify macOS Application (Self-Test)
      run: |
        ./dist/MeasureLab.app/Contents/MacOS/MeasureLab --self-test

    - name: Create DMG
      run: |
        test -f dist/MeasureLab.dmg && rm dist/MeasureLab.dmg
        create-dmg \
          --volname "MeasureLab Installer" \
          --volicon "MeasureLab.icns" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "MeasureLab.app" 200 190 \
          --hide-extension "MeasureLab.app" \
          --app-drop-link 600 185 \
          "dist/MeasureLab.dmg" \
          "dist/MeasureLab.app"

    - name: Prepare release assets
      run: |
        mkdir -p dist/release
        tag="${GITHUB_REF#refs/tags/}"
        tag="${tag//\//-}"
        cp dist/MeasureLab.dmg "dist/release/MeasureLab-${tag}-macos-arm64.dmg"

    - name: VirusTotal Scan
      id: vt
      uses: crazy-max/ghaction-virustotal@v4
      with:
        vt_api_key: ${{ secrets.VT_API_KEY }}
        files: dist/release/*.dmg

    - name: Generate VT Report Lines
      if: steps.vt.outputs.json != ''
      shell: bash
      run: |
        echo '${{ steps.vt.outputs.json }}' | jq -r '.[] | "- [\(.filename | split("/") | last)](\(.url))"' > vt_url_macos.txt

    - name: Upload VT URL
      uses: actions/upload-artifact@v4
      with:
        name: vt-url-macos
        path: vt_url_macos.txt
        if-no-files-found: ignore

    - name: Upload Release Assets
      uses: actions/upload-artifact@v4
      with:
        name: assets-macos
        path: dist/release/*

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false

    - name: Download Windows Assets
      uses: actions/download-artifact@v4
      with:
        name: assets-windows
        path: dist/release

    - name: Download Linux Assets
      uses: actions/download-artifact@v4
      with:
        name: assets-linux
        path: dist/release

    - name: Download macOS Assets
      uses: actions/download-artifact@v4
      with:
        name: assets-macos
        path: dist/release

    - name: Download VT URLs
      uses: actions/download-artifact@v4
      with:
        pattern: vt-url-*
        path: vt_urls
        merge-multiple: true

    - name: Generate Release Notes
      id: notes
      shell: bash
      run: |
        # Generate changelog
        python misc/extract_changelog.py ${GITHUB_REF#refs/tags/} > release_notes.md
        
        # If empty, use a default message
        if [ ! -s release_notes.md ]; then
          echo "Release ${GITHUB_REF#refs/tags/}" > release_notes.md
        fi

        # Append VirusTotal URLs if they exist
        if ls vt_urls/*.txt 1> /dev/null 2>&1; then
          echo -e "\n### VirusTotal Analysis" >> release_notes.md
          cat vt_urls/*.txt >> release_notes.md
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        files: dist/release/*
        body_path: release_notes.md
        draft: ${{ github.event_name == 'workflow_dispatch' }}
