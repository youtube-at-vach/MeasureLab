name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        # Pin setuptools to avoid distutils issues if necessary
        # pip install "setuptools<70.0.0" 

    - name: Convert Icon
      run: |
        magick app_icon.png -define icon:auto-resize=256,128,64,48,32,16 app_icon.ico

    - name: Prepare System ICU DLLs
      id: prepare-icu
      run: |
        mkdir libs
        copy C:\Windows\System32\icu.dll libs\
        copy C:\Windows\System32\icuuc.dll libs\
        copy C:\Windows\System32\icuin.dll libs\
        echo "ICU DLLs copied to libs/"
        ls libs

    - name: Build (onefile) with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name MeasureLab --icon=app_icon.ico --add-data "src;src" --add-binary "libs/icu*.dll;." --exclude-module matplotlib --collect-all backports --collect-all soundfile --collect-all pyfftw --hidden-import pyfftw --distpath dist/onefile --workpath build/onefile main_gui.py

    - name: Verify Windows Executable (GUI Self-Test)
      run: |
        echo "Testing dist/onefile/MeasureLab.exe with --self-test..."
        ./dist/onefile/MeasureLab.exe --self-test

    - name: Build (onedir) with PyInstaller
      run: |
        pyinstaller --windowed --name MeasureLab --icon=app_icon.ico --add-data "src;src" --add-binary "libs/icu*.dll;." --exclude-module matplotlib --collect-all backports --collect-all soundfile --collect-all pyfftw --hidden-import pyfftw --distpath dist/onedir --workpath build/onedir main_gui.py
        copy scripts/enable_asio.bat dist/onedir/MeasureLab/
        copy scripts/disable_asio.bat dist/onedir/MeasureLab/
        copy scripts/README_ASIO.txt dist/onedir/MeasureLab/

    - name: Package Windows release assets
      shell: pwsh
      run: |
        # タグ名を取得（refs/tags/... から取り除く）
        $tag = $env:GITHUB_REF -replace 'refs/tags/',''
        if (-not $tag) { $tag = 'untagged' }
        # ファイル名に使えない文字を置換
        $tag = $tag -replace '[\\/*?:"<>|]', '-'

        $outDir = "dist/release"
        New-Item -ItemType Directory -Force -Path $outDir | Out-Null

        $base = "MeasureLab-$tag-windows-x64"
        Compress-Archive -Path "dist/onefile/MeasureLab.exe" -DestinationPath "$outDir/$base-onefile.zip" -Force
        Compress-Archive -Path "dist/onedir/MeasureLab" -DestinationPath "$outDir/$base-onedir.zip" -Force

    - name: Generate Checksums
      shell: pwsh
      run: |
        $files = Get-ChildItem dist/release/*
        foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            $name = $file.Name
            "$hash  $name" | Out-File -FilePath dist/release/checksums_windows.txt -Append -Encoding ascii
        }

    - name: Upload Checksums Fragment
      uses: actions/upload-artifact@v7.0.1
      with:
        name: checksums-windows
        path: dist/release/checksums_windows.txt
        retention-days: 1

    - name: Extract CHANGELOG for version
      id: changelog
      shell: bash
      run: |
        python misc/extract_changelog.py "${GITHUB_REF#refs/tags/}" > release_notes.md
        # If empty, use a default message
        if [ ! -s release_notes.md ]; then
          echo "Release ${GITHUB_REF#refs/tags/}" > release_notes.md
        fi

    - name: Release Windows
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        files: dist/release/*.zip
        body_path: release_notes.md
        draft: ${{ github.event_name == 'workflow_dispatch' }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libxcb-cursor0 python3-cffi python3-brotli libpango-1.0-0 libpangoft2-1.0-0 fonts-noto-cjk

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<70.0.0"
        pip install -r requirements.txt
        pip install pyinstaller
        pip install -r requirements-docs.txt

    - name: Build standalone binary with PyInstaller
      run: |
        mkdir -p libs
        pyinstaller --onefile --windowed --name MeasureLab --icon=app_icon.png --add-data "src:src" --exclude-module matplotlib --collect-all backports --collect-all pyfftw --hidden-import pyfftw main_gui.py

    - name: Build Documentation
      env:
        ENABLE_PDF_EXPORT: 1
      run: mkdocs build

    - name: Prepare Manuals for release
      run: |
        mkdir -p dist/release
        mv site/pdf/operation_manual.pdf dist/release/operation_manual_ja.pdf
        mv site/en/pdf/operation_manual.pdf dist/release/operation_manual_en.pdf

    - name: Build AppImage
      run: |
        chmod +x build_appimage.sh
        ./build_appimage.sh

    - name: Rename AppImage for release
      shell: bash
      run: |
        set -euo pipefail
        tag="${GITHUB_REF#refs/tags/}"
        tag="${tag//\//-}"
        mkdir -p dist/release
        shopt -s nullglob
        candidates=(MeasureLab*.AppImage)
        if [ ${#candidates[@]} -eq 0 ]; then
          echo "No AppImage found" >&2
          exit 1
        fi
        mv "${candidates[0]}" "dist/release/MeasureLab-${tag}-linux-x86_64.AppImage"

    - name: Generate Checksums
      run: |
        cd dist/release
        sha256sum ./* > checksums_linux.txt

    - name: Upload Checksums Fragment
      uses: actions/upload-artifact@v7.0.1
      with:
        name: checksums-linux
        path: dist/release/checksums_linux.txt
        retention-days: 1

    - name: Extract CHANGELOG for version
      id: changelog
      run: |
        python misc/extract_changelog.py "${GITHUB_REF#refs/tags/}" > release_notes.md
        # If empty, use a default message
        if [ ! -s release_notes.md ]; then
          echo "Release ${GITHUB_REF#refs/tags/}" > release_notes.md
        fi

    - name: Release Linux
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        files: |
          dist/release/*.AppImage
          dist/release/*.pdf
        body_path: release_notes.md
        draft: ${{ github.event_name == 'workflow_dispatch' }}

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"

    - name: Install System Dependencies
      run: |
        brew install create-dmg portaudio fftw libsndfile

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Create App Icon
      run: |
        # Create iconset directory
        mkdir MeasureLab.iconset
        
        # Resize images using sips
        # 16x16
        sips -z 16 16     app_icon.png --out MeasureLab.iconset/icon_16x16.png
        sips -z 32 32     app_icon.png --out MeasureLab.iconset/icon_16x16@2x.png
        # 32x32
        sips -z 32 32     app_icon.png --out MeasureLab.iconset/icon_32x32.png
        sips -z 64 64     app_icon.png --out MeasureLab.iconset/icon_32x32@2x.png
        # 128x128
        sips -z 128 128   app_icon.png --out MeasureLab.iconset/icon_128x128.png
        sips -z 256 256   app_icon.png --out MeasureLab.iconset/icon_128x128@2x.png
        # 256x256
        sips -z 256 256   app_icon.png --out MeasureLab.iconset/icon_256x256.png
        sips -z 512 512   app_icon.png --out MeasureLab.iconset/icon_256x256@2x.png
        # 512x512
        sips -z 512 512   app_icon.png --out MeasureLab.iconset/icon_512x512.png
        sips -z 1024 1024 app_icon.png --out MeasureLab.iconset/icon_512x512@2x.png

        # Convert iconset to icns
        iconutil -c icns MeasureLab.iconset
        rm -rf MeasureLab.iconset

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm MeasureLab_macOS.spec

    - name: Sign App with Entitlements
      run: |
        codesign --deep --force --options=runtime --entitlements entitlements_mac.plist --sign - dist/MeasureLab.app

    - name: Verify macOS Application (Self-Test)
      run: |
        echo "Testing dist/MeasureLab.app/Contents/MacOS/MeasureLab with --self-test..."
        ./dist/MeasureLab.app/Contents/MacOS/MeasureLab --self-test

    - name: Create DMG
      run: |
        # Create DMG using create-dmg
        test -f dist/MeasureLab.dmg && rm dist/MeasureLab.dmg
        create-dmg \
          --volname "MeasureLab Installer" \
          --volicon "MeasureLab.icns" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "MeasureLab.app" 200 190 \
          --hide-extension "MeasureLab.app" \
          --app-drop-link 600 185 \
          "dist/MeasureLab.dmg" \
          "dist/MeasureLab.app"

    - name: Prepare release assets
      run: |
        mkdir -p dist/release
        tag="${GITHUB_REF#refs/tags/}"
        tag="${tag//\//-}"
        cp dist/MeasureLab.dmg "dist/release/MeasureLab-${tag}-macos-arm64.dmg"

    - name: Generate Checksums
      run: |
        cd dist/release
        shasum -a 256 ./* > checksums_macos.txt

    - name: Upload Checksums Fragment
      uses: actions/upload-artifact@v7.0.1
      with:
        name: checksums-macos
        path: dist/release/checksums_macos.txt
        retention-days: 1
    - name: Extract CHANGELOG for version
      id: changelog
      run: |
        python misc/extract_changelog.py "${GITHUB_REF#refs/tags/}" > release_notes.md
        # If empty, use a default message
        if [ ! -s release_notes.md ]; then
          echo "Release ${GITHUB_REF#refs/tags/}" > release_notes.md
        fi

    - name: Release macOS
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        files: dist/release/*.dmg
        body_path: release_notes.md
        draft: ${{ github.event_name == 'workflow_dispatch' }}

  build-macos-intel:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v4.3.1
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.12"

    - name: Install System Dependencies
      run: |
        brew install create-dmg fftw

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        PYFFTW_FFTW_PREFIX=$(brew --prefix fftw) pip install -r requirements.txt --no-binary pyfftw
        pip install pyinstaller

    - name: Create App Icon
      run: |
        # Create iconset directory
        mkdir MeasureLab.iconset
        
        # Resize images using sips
        # 16x16
        sips -z 16 16     app_icon.png --out MeasureLab.iconset/icon_16x16.png
        sips -z 32 32     app_icon.png --out MeasureLab.iconset/icon_16x16@2x.png
        # 32x32
        sips -z 32 32     app_icon.png --out MeasureLab.iconset/icon_32x32.png
        sips -z 64 64     app_icon.png --out MeasureLab.iconset/icon_32x32@2x.png
        # 128x128
        sips -z 128 128   app_icon.png --out MeasureLab.iconset/icon_128x128.png
        sips -z 256 256   app_icon.png --out MeasureLab.iconset/icon_128x128@2x.png
        # 256x256
        sips -z 256 256   app_icon.png --out MeasureLab.iconset/icon_256x256.png
        sips -z 512 512   app_icon.png --out MeasureLab.iconset/icon_256x256@2x.png
        # 512x512
        sips -z 512 512   app_icon.png --out MeasureLab.iconset/icon_512x512.png
        sips -z 1024 1024 app_icon.png --out MeasureLab.iconset/icon_512x512@2x.png

        # Convert iconset to icns
        iconutil -c icns MeasureLab.iconset
        rm -rf MeasureLab.iconset

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm MeasureLab_macOS.spec

    - name: Sign App with Entitlements
      run: |
        codesign --deep --force --options=runtime --entitlements entitlements_mac.plist --sign - dist/MeasureLab.app

    - name: Verify macOS Application (Self-Test)
      run: |
        echo "Testing dist/MeasureLab.app/Contents/MacOS/MeasureLab with --self-test..."
        ./dist/MeasureLab.app/Contents/MacOS/MeasureLab --self-test

    - name: Create DMG
      run: |
        # Create DMG using create-dmg
        test -f dist/MeasureLab.dmg && rm dist/MeasureLab.dmg
        create-dmg \
          --volname "MeasureLab Installer" \
          --volicon "MeasureLab.icns" \
          --window-pos 200 120 \
          --window-size 800 400 \
          --icon-size 100 \
          --icon "MeasureLab.app" 200 190 \
          --hide-extension "MeasureLab.app" \
          --app-drop-link 600 185 \
          "dist/MeasureLab.dmg" \
          "dist/MeasureLab.app"

    - name: Prepare release assets
      run: |
        mkdir -p dist/release
        tag="${GITHUB_REF#refs/tags/}"
        tag="${tag//\//-}"
        cp dist/MeasureLab.dmg "dist/release/MeasureLab-${tag}-macos-x64.dmg"

    - name: Generate Checksums
      run: |
        cd dist/release
        shasum -a 256 ./* > checksums_macos_intel.txt

    - name: Upload Checksums Fragment
      uses: actions/upload-artifact@v7.0.1
      with:
        name: checksums-macos-intel
        path: dist/release/checksums_macos_intel.txt
        retention-days: 1

    - name: Extract CHANGELOG for version
      id: changelog
      run: |
        python misc/extract_changelog.py "${GITHUB_REF#refs/tags/}" > release_notes.md
        # If empty, use a default message
        if [ ! -s release_notes.md ]; then
          echo "Release ${GITHUB_REF#refs/tags/}" > release_notes.md
        fi

    - name: Release macOS Intel
      uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
      if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
      with:
        token: ${{ secrets.RELEASE_TOKEN }}
        files: dist/release/*.dmg
        body_path: release_notes.md
        draft: ${{ github.event_name == 'workflow_dispatch' }}

  release-checksums:
    needs: [build-windows, build-linux, build-macos, build-macos-intel]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download Checksums
        uses: actions/download-artifact@v8
        with:
          pattern: checksums-*
          merge-multiple: true

      - name: Merge Checksums
        run: |
          cat checksums_windows.txt checksums_linux.txt checksums_macos.txt checksums_macos_intel.txt > CHECKSUMS.txt
          sort -k 2 -o CHECKSUMS.txt CHECKSUMS.txt
          echo "Checksums generated:"
          cat CHECKSUMS.txt

      - name: Release Checksums
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          files: CHECKSUMS.txt
          draft: ${{ github.event_name == 'workflow_dispatch' }}
