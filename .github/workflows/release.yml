name: Release

on:
  push:
    tags: ['v*']
  # A branch run builds artifacts only. A tag run prepares a draft release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate Rust version and exact tag
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          match = re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?', version)
          if not match or tuple(map(int, match.group(1, 2, 3))) < (0, 10, 0):
              raise SystemExit('Only Rust releases from v0.10.0 are supported')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != f'v{version}':
              raise SystemExit('Tag does not match Cargo.toml')
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nsha={sha}\n')
          PY
      - name: Require main ancestry and passed required CI at the tagged commit
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SOURCE_SHA&event=push&branch=main&per_page=1" --jq '.workflow_runs[0].id')
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo 'No main push CI found for the tagged commit. Run CI before releasing.' >&2
            exit 1
          fi
          passed=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=all&per_page=100" --jq '
            [.[].jobs[] | select(.name == "lint-and-test" or .name == "docs-lint" or .name == "actionlint")]
            | group_by(.name) | map(max_by(.id))
            | length == 3 and all(.[]; .status == "completed" and .conclusion == "success")')
          if [[ "$passed" != true ]]; then
            echo 'Required CI has not passed at this SHA. Wait for CI, then rerun this workflow.' >&2
            exit 1
          fi

  windows:
    needs: prepare
    uses: ./.github/workflows/build_windows.yml
    with:
      release-assets: true

  linux:
    needs: prepare
    uses: ./.github/workflows/build_linux.yml
    with:
      release-assets: true

  macos:
    needs: prepare
    uses: ./.github/workflows/build_macos.yml
    with:
      release-assets: true

  draft-release:
    if: github.ref_type == 'tag'
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.windows.outputs.artifact }}
          path: release-assets/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.linux.outputs.artifact }}
          path: release-assets/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.macos.outputs.intel_artifact }}
          path: release-assets/macos-x86_64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.macos.outputs.arm64_artifact }}
          path: release-assets/macos-arm64
      - name: Verify Windows assets and build identity
        working-directory: release-assets/windows
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS-windows-x64.txt
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          base = f'MeasureLab-{os.environ["RELEASE_TAG"]}-windows-x64'
          expected = {f'{base}-setup.exe', f'{base}.zip', f'{base}-build-info.json', 'SHA256SUMS-windows-x64.txt'}
          if {p.name for p in Path('.').iterdir()} != expected:
              raise SystemExit('Unexpected or incomplete release asset set')
          info = json.loads(Path(f'{base}-build-info.json').read_text())
          assert info['version'] == os.environ['RELEASE_VERSION']
          assert info['source_sha'] == os.environ['SOURCE_SHA'] and not info['source_dirty']
          assert info['target'] == 'x86_64-pc-windows-msvc' and info['crt_static']
          assert info['features'] == ['desktop'] and info['profile'] == 'release'
          with zipfile.ZipFile(f'{base}.zip') as archive:
              assert json.loads(archive.read('MeasureLab/build-info.json')) == info
              assert hashlib.sha256(archive.read('MeasureLab/measurelab.exe')).hexdigest() == info['executable_sha256']
          PY
      - name: Verify Linux assets and build identity
        run: python3 scripts/linux_package.py verify release-assets/linux --source-sha "$SOURCE_SHA" --require-clean
      - name: Verify both macOS asset sets and build identities
        run: |
          python3 scripts/macos_package.py verify release-assets/macos-x86_64 --target x86_64-apple-darwin --source-sha "$SOURCE_SHA" --require-clean
          python3 scripts/macos_package.py verify release-assets/macos-arm64 --target aarch64-apple-darwin --source-sha "$SOURCE_SHA" --require-clean
      - name: Prepare release notes
        run: |
          python3 misc/extract_changelog.py "$RELEASE_TAG" > release-notes.md
          test -s release-notes.md
          cat >> release-notes.md <<'NOTES'

          Windows x64 Rust prototype: user-scoped installer and portable ZIP.
          Windows audio/measurement acceptance remains in progress. See the Rust manual for current limitations.
          These files are not Authenticode signed. Verify downloads with SHA256SUMS-windows-x64.txt.

          Linux x86_64 Rust prototype: AppImage and an equivalent tar.gz AppDir archive.
          Built on Ubuntu 22.04, with glibc requirements checked against 2.35.
          Ubuntu 22.04/24.04/26.04 package checks use a software Vulkan driver; physical audio and desktop acceptance remain in progress.
          Verify Linux downloads with SHA256SUMS-linux-x86_64.txt. These assets do not include publisher signatures.

          macOS Rust prototype: separate Intel x86_64 and Apple Silicon arm64 DMGs, with a macOS 13.0 deployment target.
          Open the matching DMG and copy MeasureLab.app to Applications. Keep any Python app separately before copying.
          Allow microphone access when starting real audio input, including external Core Audio devices.
          The apps have ad-hoc signatures with Hardened Runtime and the audio-input entitlement; they are not Developer ID signed or notarized.
          Gatekeeper may require Open Anyway under System Settings > Privacy & Security after verifying the download.
          Verify macOS downloads with the matching SHA256SUMS-macos-<ARCH>.txt. First-run permissions, physical audio and OS-version acceptance remain in progress.
          The final Python distribution remains v0.9.1.
          NOTES
          printf '\nSource commit: %s\n' "$SOURCE_SHA" >> release-notes.md
      - name: Create a new draft with all tested assets
        run: |
          set -euo pipefail
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo 'The remote tag moved after validation. Refusing to release.' >&2
            exit 1
          fi
          # Never overwrite a previous attempt or mix assets from different builds.
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")
          if [[ -n "$existing" ]]; then
            echo 'A release already exists. Inspect it; remove an incomplete draft before retrying.' >&2
            exit 1
          fi
          args=(--draft --verify-tag --latest=false --title "MeasureLab $RELEASE_TAG (Rust prototype)" --notes-file release-notes.md)
          if [[ "$RELEASE_VERSION" == "0.10.0" || "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" release-assets/windows/* release-assets/linux/* release-assets/macos-x86_64/* release-assets/macos-arm64/*
