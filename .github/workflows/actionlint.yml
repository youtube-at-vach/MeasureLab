name: Lint GitHub Actions workflows
on:
  pull_request:
  push:
    branches: [main, rewrite/rust]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint
        env:
          ACTIONLINT_VERSION: '1.7.12'
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --location --retry 3 "$base/$archive" -o "$archive"
          curl --fail --location --retry 3 "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt" -o checksums.txt
          awk -v name="$archive" '$2 == name { print; found = 1 } END { if (!found) exit 1 }' checksums.txt > selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" actionlint
        shell: bash
      - name: Check workflow files
        run: ./actionlint -color
        shell: bash
