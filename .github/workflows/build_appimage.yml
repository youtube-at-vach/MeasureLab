name: Build AppImage

on:

  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - '*.py'
              - '*.spec'
              - '*.sh'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'constraints.txt'
              - 'app_icon.*'
              - 'entitlements_mac.plist'
              - '.github/workflows/build*.yml'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev libxcb-cursor0 libsndfile1 libfftw3-dev

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools<70.0.0"
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build standalone binary with PyInstaller
      run: |
        # Create libs directory if it doesn't exist (though not strictly needed for system-wide pyinstaller)
        mkdir -p libs
        # Run PyInstaller
        pyinstaller --onefile --windowed --name MeasureLab --icon=app_icon.png --add-data "src:src" --exclude-module matplotlib --collect-all backports --collect-all soundfile --collect-all pyfftw --hidden-import pyfftw main_gui.py

    - name: Build AppImage
      run: |
        chmod +x build_appimage.sh
        ./build_appimage.sh

    - name: Verify AppImage (GUI Self-Test)
      run: |
        sudo apt-get install -y xvfb libegl1 libopengl0 libportaudio2
        sudo apt-get install -y libxcb-cursor0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxcb-render0 libxcb-shape0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0

        # Find the generated AppImage
        APPIMAGE=$(find . -name "MeasureLab-*.AppImage" | head -n 1)
        chmod +x "$APPIMAGE"
        echo "Testing $APPIMAGE with --self-test..."
        # Run with xvfb and --appimage-extract-and-run to avoid FUSE issues in CI
        xvfb-run -a "$APPIMAGE" --appimage-extract-and-run --self-test

    - name: Upload AppImage
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: MeasureLab-AppImage
        path: MeasureLab-*.AppImage
