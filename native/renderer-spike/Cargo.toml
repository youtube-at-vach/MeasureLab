[package]
name = "renderer-spike"
version = "0.1.0"
edition = "2024"
publish = false

# Keep renderer experiments from changing the existing evaluation dependency graph.
[workspace]

[dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "vulkan", "wgsl"] }
pollster = "=0.4.0"
bytemuck = { version = "=1.25.0", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"

[profile.release]
debug = 1
