[build-system]
requires = ["setuptools>=69,<83", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MeasureLab"
version = "0.7.4"
description = "DIY audio measurement and analysis suite"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Unlicense"}
authors = [
  {name = "MeasureLab maintainers"}
]
dependencies = [
  # numpy 2.4.2 causes "DLL load failed" on Windows. Keep < 2.4.0.
  "numpy>=1.24,<2.4.0",
  "scipy>=1.11,<1.18",
  "sounddevice>=0.4.6,<0.6",
  "PyQt6>=6.6,<6.12",
  "pyqtgraph>=0.13,<0.15",
  "soundfile>=0.12,<0.14",
  "PyWavelets>=1.5,<1.10",
  "pyfftw>=0.13,<0.16",
  "certifi>=2024.0.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.7.0",
  "mypy>=1.9.0",
  "pytest>=7.4.0",
  "pytest-qt>=4.2.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Start with a narrow, low-noise rule set focused on correctness and
# the whitespace issue (W293) that currently breaks CI. Broaden later as we
# pay down existing style debt.
select = ["E9", "F", "E7", "E4", "W292", "W293", "B"]
ignore = []

[tool.ruff.lint.per-file-ignores]


[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = true
warn_return_any = false
warn_unreachable = true
files = ["src/core", "src/gui"]

[[tool.mypy.overrides]]
module = "src.gui.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "src.core.update_checker"
disable_error_code = ["import-untyped"]

[tool.pytest.ini_options]
addopts = "-ra"
