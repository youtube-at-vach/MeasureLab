[package]
name = "measurelab"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "GPU audio measurement workspace with oscilloscope, spectrum, spectrogram and XY"
license = "Unlicense"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:bytemuck", "dep:pollster"]
qa = ["desktop", "dep:png"]

[dependencies]
cpal = "0.18.2"
rtrb = "0.4.0"
rustfft = "6.4.1"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "1.0.1", optional = true }
png = { version = "0.18", optional = true }

[[bin]]
name = "measurelab"
path = "src/main.rs"
required-features = ["desktop"]

[[bench]]
name = "waveform"
harness = false

[[bench]]
name = "spectrum"
harness = false

[[bench]]
name = "spectrogram"
harness = false

[[bench]]
name = "xy"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
