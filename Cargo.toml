[package]
name = "measurelab"
version = "0.10.0"
edition = "2024"
rust-version = "1.95"
description = "GPU audio measurement workspace with oscilloscope, spectrum, spectrogram and XY"
license = "Unlicense"

[features]
default = ["desktop"]
desktop = ["dep:eframe", "dep:bytemuck", "dep:pollster", "dep:rfd", "dep:png", "dep:winresource"]
qa = ["desktop", "dep:log"]

[dependencies]
cpal = "0.18.2"
rtrb = "0.4.0"
rustfft = "6.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
log = { version = "0.4", optional = true }
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "1.0.1", optional = true }
# Parentless dialogs use the portal on both X11 and Wayland, without handle export.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"], optional = true }
png = { version = "0.18", optional = true }

[build-dependencies]
# Keep this host-independent so Windows cross-compilation can embed resources.
winresource = { version = "0.1.34", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSProcessInfo"] }

[[bin]]
name = "measurelab"
path = "src/main.rs"
required-features = ["desktop"]

[[bench]]
name = "waveform"
harness = false

[[bench]]
name = "spectrum"
harness = false

[[bench]]
name = "spectrogram"
harness = false

[[bench]]
name = "xy"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Daily GUI iteration: retain optimized DSP/dependencies and runtime checks,
# but emit only the debug information needed for file/line backtraces.
# Use dev for full debugger information and release for performance acceptance.
[profile.dev-fast]
inherits = "dev"
debug = "line-tables-only"
lto = "off"
