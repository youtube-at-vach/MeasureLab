site_url: https://vach.github.io/MeasureLab/
site_name: MeasureLab オペレーションマニュアル
site_description: 測定ツールの操作マニュアル
site_author: ''
theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - i18n.languages
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/chart-bell-curve-cumulative
    favicon: material/chart-bell-curve-cumulative

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

plugins:
  - search
  - i18n:
      default_language: ja
      languages:
        - locale: ja
          name: 日本語
          default: true
          build: true
          site_name: MeasureLab オペレーションマニュアル
          site_description: 測定ツールの操作マニュアル
        - locale: en
          name: English
          build: true
          site_name: MeasureLab Operation Manual
          site_description: Operation manual for measurement tools
      # nav_translations is not supported in this version, so we use H1 auto-labeling where possible.
  - with-pdf:
      author: MeasureLab maintainers
      copyright: Unlicense
      cover: true
      back_cover: true
      output_path: pdf/measurelab-manual.pdf
      enabled_if_env: ENABLE_PDF_EXPORT


extra_css:
  - stylesheets/extra.css
