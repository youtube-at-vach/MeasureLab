site_url: https://youtube-at-vach.github.io/MeasureLab/
hooks:
  - docs/hooks/render_math.py
site_name: MeasureLab オペレーションマニュアル
site_description: 測定ツールの操作マニュアル
site_author: ""
repo_name: youtube-at-vach/MeasureLab
repo_url: https://github.com/youtube-at-vach/MeasureLab
theme:
  name: material
  language: ja
  features:
    - navigation.tabs
    - i18n.languages
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    logo: material/chart-bell-curve-cumulative
    favicon: assets/images/favicon.png

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search
  - i18n:
      languages:
        - locale: ja
          name: 日本語
          default: true
          build: true
          site_name: MeasureLab オペレーションマニュアル
          site_description: 測定ツールの操作マニュアル
        - locale: en
          name: English
          build: true
          site_name: MeasureLab Operation Manual
          site_description: Operation manual for measurement tools
          nav_translations:
            ホーム: Home
            クイックスタート: Quick Start
            はじめに: Getting Started
            ようこそ: Welcome
            キャリブレーション: Calibration
            UI概要: UI Overview
            設定: Settings
            ウィジット: Widgets
            基本: Basics
            信号生成と入出力: Signal Generation & I/O
            信号発生器: Signal Generator
            録音・再生: Recorder / Player
            ループバック検出: Loopback Finder
            生時系列: Raw Time Series
            信号可視化: Signal Visualization
            オシロスコープ: Oscilloscope
            スペクトラムアナライザー: Spectrum Analyzer
            スペクトログラム: Spectrogram
            ゴニオメーター: Goniometer
            ステレオ位置合わせモニター: Stereo Alignment Monitor
            精密測定: Precision Measurement
            ロックインアンプ: Lock-in Amplifier
            ロックイン周波数カウンター: Lock-in Frequency Counter
            ロックイン高調波解析: Lock-in Harmonic Analyzer
            ロックインTHD解析: Lock-in THD Analyzer
            ロックインスペクトラム検出: Lock-in Spectrum Finder
            周波数カウンター: Frequency Counter
            高度歪みメーター: Advanced Distortion Meter
            歪み解析: Distortion Analyzer
            直線性解析: Linearity Analyzer
            音響・オーディオ解析: Acoustic & Audio Analysis
            音圧レベルメーター: Sound Level Meter
            LUFSメーター: LUFS Meter
            音質解析: Sound Quality Analyzer
            ノイズプロファイラー: Noise Profiler
            過渡解析: Transient Analyzer
            BNIMメーター: BNIM Meter
            デバイス・システム解析: Device & System Analysis
            インピーダンス解析: Impedance Analyzer
            ネットワーク解析: Network Analyzer
            逆フィルター: Inverse Filter
            HRTFプレイヤー: HRTF Player
            空間バイノーラルミキサー: Spatial Binaural Mixer
            超音波変調器: Ultrasound Modulator
            タイミング・基準信号: Timing & Reference
            1PPSモニター: 1PPS Monitor
            タイムコードモニター: Timecode Monitor
            ボックスカー平均器: Boxcar Averager
            ユーティリティ: Utilities
            分離ウィンドウラッパー: Detachable Wrapper
            プロセッサーベンチマーク: Processor Benchmark
            測定レシピ: Measurement Recipes
            概要: Overview
            ノイズ測定: Noise Measurement
            歪み測定: Distortion Measurement
            スピーカーインピーダンス: Speaker Impedance
            理論と実装: Theory & Implementation
            ロックインアンプ実装: Lock-in Amplifier Implementation
            カルマンフィルター: Kalman Filter
            リファレンス: Reference
            用語集: Glossary
            付録: Appendix
            開発情報: Development
            提案機能: Proposed Features
            ダウンロード: Download
            リリースページ: Release Page
  - with-pdf:
      author: MeasureLab maintainers
      copyright: Unlicense
      cover: true
      back_cover: true
      cover_subtitle: "Open-source Audio & Signal Measurement Software for DIY and Research"
      output_path: pdf/operation_manual.pdf
      enabled_if_env: ENABLE_PDF_EXPORT

extra_css:
  - stylesheets/extra.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css
nav:
  - ホーム: index.md
  - クイックスタート: quickstart.md

  - はじめに:
      - キャリブレーション: calibration.md
      - UI概要: widget_guide.md

  - ウィジット:
      - 基本:
          - ようこそ: widgets/welcome.md
          - 設定: widgets/settings.md
      - 信号生成と入出力:
          - 信号発生器: widgets/signal_generator.md
          - 録音・再生: widgets/recorder_player.md
          - ループバック検出: widgets/loopback_finder.md
          - 生時系列: widgets/raw_time_series.md
      - 信号可視化:
          - オシロスコープ: widgets/oscilloscope.md
          - スペクトラムアナライザー: widgets/spectrum_analyzer.md
          - スペクトログラム: widgets/spectrogram.md
          - ゴニオメーター: widgets/goniometer.md
          - ステレオ位置合わせモニター: widgets/stereo_alignment_monitor.md
      - 精密測定:
          - ロックインアンプ: widgets/lock_in_amplifier.md
          - ロックイン周波数カウンター: widgets/lock_in_frequency_counter.md
          - ロックイン高調波解析: widgets/lockin_harmonic_analyzer.md
          - ロックインTHD解析: widgets/lockin_thd_analyzer.md
          - ロックインスペクトラム検出: widgets/lockin_spectrum_finder.md
          - 周波数カウンター: widgets/frequency_counter.md
          - 高度歪みメーター: widgets/advanced_distortion_meter.md
          - 歪み解析: widgets/distortion_analyzer.md
          - 直線性解析: widgets/linearity_analyzer.md
      - 音響・オーディオ解析:
          - 音圧レベルメーター: widgets/sound_level_meter.md
          - LUFSメーター: widgets/lufs_meter.md
          - 音質解析: widgets/sound_quality_analyzer.md
          - ノイズプロファイラー: widgets/noise_profiler.md
          - 過渡解析: widgets/transient_analyzer.md
          - BNIMメーター: widgets/bnim_meter.md
      - デバイス・システム解析:
          - インピーダンス解析: widgets/impedance_analyzer.md
          - ネットワーク解析: widgets/network_analyzer.md
          - 逆フィルター: widgets/inverse_filter.md
          - HRTFプレイヤー: widgets/hrtf_player.md
          - 空間バイノーラルミキサー: widgets/spatial_binaural_mixer.md
          - 超音波変調器: widgets/ultrasound_modulator.md
      - タイミング・基準信号:
          - 1PPSモニター: widgets/one_pps_monitor.md
          - タイムコードモニター: widgets/timecode_monitor.md
          - ボックスカー平均器: widgets/boxcar_averager.md
      - ユーティリティ:
          - 分離ウィンドウラッパー: widgets/detachable_wrapper.md
          - プロセッサーベンチマーク: widgets/processor_benchmark.md

  - 測定レシピ:
      - 概要: measurement_recipes/index.md
      - ノイズ測定: measurement_recipes/noise_measurement.md
      - 歪み測定: measurement_recipes/distortion_measurement.md
      - スピーカーインピーダンス: measurement_recipes/speaker_impedance.md
      - ロックインアンプ: measurement_recipes/lockin_amplifier.md


  - リファレンス:
      - 用語集: glossary.md
      - 付録: appendix.md
      - 開発情報: development.md
      - 提案機能: PROPOSED_FEATURES.md
      - リリースページ: https://github.com/youtube-at-vach/MeasureLab/releases/
    
  - ダウンロード: https://youtube-at-vach.github.io/MeasureLab/download/
